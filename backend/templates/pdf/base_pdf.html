<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    @page {
      size: A4;
      margin: 20mm 18mm;
      @bottom-center {
        content: "FPP — Front Patriotique Panafricain • fpp-ci.online";
        font-family: sans-serif;
        font-size: 7pt;
        color: #999999;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 10pt;
      color: #1a1a1a;
      line-height: 1.5;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 3px solid #00A651;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo-img {
      width: 48px;
      height: auto;
    }

    .header-logo {
      border-left: 4px solid #00A651;
      padding-left: 12px;
    }

    .header-logo .logo-text {
      font-size: 22pt;
      font-weight: 700;
      color: #111111;
      letter-spacing: 3px;
      line-height: 1;
    }

    .header-logo .logo-subtitle {
      font-size: 7pt;
      font-weight: 600;
      color: #00A651;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 3px;
    }

    .header-right {
      text-align: right;
    }

    .header-right .doc-type {
      font-size: 8pt;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .header-right .doc-date {
      font-size: 8pt;
      color: #999999;
      margin-top: 2px;
    }

    h1 {
      font-size: 16pt;
      font-weight: 700;
      color: #111111;
      margin-bottom: 4px;
    }

    h1 .accent { color: #00A651; }

    .subtitle {
      font-size: 9pt;
      color: #666666;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 9pt;
      font-weight: 700;
      color: #00A651;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 2px solid #00A651;
      padding-bottom: 4px;
      margin-top: 18px;
      margin-bottom: 10px;
    }

    table.form-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 14px;
    }

    table.form-table td {
      padding: 6px 10px;
      vertical-align: top;
      border: 1px solid #e0e0e0;
    }

    table.form-table .label {
      font-size: 7.5pt;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      width: 28%;
      background-color: #f8f9fa;
    }

    table.form-table .value {
      font-size: 10pt;
      color: #111111;
      font-weight: 500;
    }

    table.form-table .value.placeholder {
      color: #cccccc;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 2px;
    }

    .photo-box {
      width: 100px;
      height: 120px;
      border: 2px dashed #cccccc;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 7pt;
      color: #bbbbbb;
      margin: 0 auto;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-box.filled {
      border: 2px solid #00A651;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 4px;
      font-size: 8pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge.validated { background: #d4edda; color: #155724; }
    .status-badge.pending { background: #fff3cd; color: #856404; }
    .status-badge.sympathisant { background: #e2e3e5; color: #383d41; }

    .footer-signature {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
    }

    .signature-box {
      width: 45%;
      text-align: center;
    }

    .signature-box .sig-label {
      font-size: 8pt;
      color: #888888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 40px;
    }

    .signature-box .sig-line {
      border-top: 1px solid #cccccc;
      padding-top: 4px;
      font-size: 8pt;
      color: #666666;
    }

    .watermark {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-45deg);
      font-size: 60pt;
      font-weight: 900;
      color: rgba(0, 166, 81, 0.04);
      letter-spacing: 10px;
      white-space: nowrap;
      z-index: -1;
    }
  </style>
  {% block extra_style %}{% endblock %}
</head>
<body>
  <div class="watermark">FPP</div>

  <div class="header">
    <div class="header-left">
      {% if logo_data_uri %}
        <img src="{{ logo_data_uri }}" alt="FPP" class="header-logo-img">
      {% endif %}
      <div class="header-logo">
        <div class="logo-text">FPP</div>
        <div class="logo-subtitle">Front Patriotique Panafricain</div>
      </div>
    </div>
    <div class="header-right">
      <div class="doc-type">{% block doc_type %}Document{% endblock %}</div>
      <div class="doc-date">{% block doc_date %}{% endblock %}</div>
    </div>
  </div>

  {% block content %}{% endblock %}
</body>
</html>
